<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 44" fill="none">
  <defs>
    <linearGradient id="water" x1="8" y1="6" x2="100" y2="38">
      <stop offset="0" stop-color="#163a8a"/>
      <stop offset=".32" stop-color="#2563eb"/>
      <stop offset=".62" stop-color="#3d7eff"/>
      <stop offset="1" stop-color="#7eb6ff"/>
